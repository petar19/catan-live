name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/parser/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build --workspace=packages/parser
      - name: Build web app
        run: npm run build --workspace=apps/web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RESOLVE_SHARE_FUNCTION_URL: ${{ secrets.VITE_RESOLVE_SHARE_FUNCTION_URL }}
          VITE_ADMIN_EMAIL: petar.lazic.fer@gmail.com
      # GitHub Pages can't do server-side rewrites, so a direct/shared link to
      # a client-side route (e.g. /shared/:id) 404s unless there's a fallback
      # file. Pages serves 404.html for any unmatched path while leaving the
      # browser's URL untouched, so a copy of index.html here is enough —
      # React Router reads the real location once the app mounts.
      - name: Add SPA fallback for GitHub Pages
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
